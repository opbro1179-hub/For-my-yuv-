<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Only For Yuv ❤️</title>
<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial, sans-serif;
text-align:center;
overflow:hidden;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

h1{
font-size:40px;
color:red;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px red;}
to{ text-shadow:0 0 30px pink;}
}

button{
padding:15px 30px;
font-size:18px;
background:red;
border:none;
color:white;
border-radius:30px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:pink;
}

.heart{
position:absolute;
color:red;
font-size:20px;
animation: float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh); opacity:1;}
100%{transform:translateY(-10vh); opacity:0;}
}
</style>
</head>
<body>

<div class="container">
<h1>Only For Yuv ❤️</h1>
<p>My little jealous baby... listen carefully.</p>
<p>You are my peace. My comfort. My future.</p>
<p>I choose you. Every single day.</p>

<button onclick="showLove()">Click if you forgive me ❤️</button>
</div>

<script>
function showLove(){
document.body.innerHTML =
"<div style='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;'>"+
"<h1 style='color:pink;font-size:45px;'>I Love You Yuv ❤️</h1>"+
"<p style='font-size:22px;'>Forever. Only You.</p>"+
"</div>";

for(let i=0;i<50;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(heart);
}
}
</script>

</body>
</html>
